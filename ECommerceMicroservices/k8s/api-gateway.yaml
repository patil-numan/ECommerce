apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost/ecommerce-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ReverseProxy__Clusters__product-cluster__Destinations__product-destination__Address
              value: "http://product-service:8080/"
            - name: ReverseProxy__Clusters__user-cluster__Destinations__user-destination__Address
              value: "http://user-service:8080/"
            - name: ReverseProxy__Clusters__order-cluster__Destinations__order-destination__Address
              value: "http://order-service:8080/"
            - name: ReverseProxy__Clusters__payment-cluster__Destinations__payment-destination__Address
              value: "http://payment-service:8080/"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort
name: ECommerce CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ECommerceMicroservices/ECommerceMicroservices.slnx

      - name: Build solution
        run: dotnet build ECommerceMicroservices/ECommerceMicroservices.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ECommerceMicroservices/ECommerceMicroservices.slnx --configuration Release --no-build

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Product Service image
        run: |
          podman build \
            -t localhost/ecommerce-product-service:ci \
            -f ECommerceMicroservices/Services/ProductService/Containerfile \
            ECommerceMicroservices

      - name: Build User Service image
        run: |
          podman build \
            -t localhost/ecommerce-user-service:ci \
            -f ECommerceMicroservices/Services/UserService/Containerfile \
            ECommerceMicroservices

      - name: Build Order Service image
        run: |
          podman build \
            -t localhost/ecommerce-order-service:ci \
            -f ECommerceMicroservices/Services/OrderService/Containerfile \
            ECommerceMicroservices

      - name: Build Payment Service image
        run: |
          podman build \
            -t localhost/ecommerce-payment-service:ci \
            -f ECommerceMicroservices/Services/PaymentService/Containerfile \
            ECommerceMicroservices

      - name: Build API Gateway image
        run: |
          podman build \
            -t localhost/ecommerce-api-gateway:ci \
            -f ECommerceMicroservices/ApiGateway/Containerfile \
            ECommerceMicroservices

name: ECommerce CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ECommerceMicroservices/ECommerceMicroservices.slnx

      - name: Build solution
        run: dotnet build ECommerceMicroservices/ECommerceMicroservices.slnx --configuration Release --no-restore

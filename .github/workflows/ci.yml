name: ECommerce CI

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore ECommerceMicroservices/ECommerceMicroservices.slnx

      - name: Build solution
        run: dotnet build ECommerceMicroservices/ECommerceMicroservices.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ECommerceMicroservices/ECommerceMicroservices.slnx --configuration Release --no-build

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Product Service image
        run: |
          podman build \
            -t localhost/ecommerce-product-service:ci \
            -f ECommerceMicroservices/Services/ProductService/Containerfile \
            ECommerceMicroservices

      - name: Build User Service image
        run: |
          podman build \
            -t localhost/ecommerce-user-service:ci \
            -f ECommerceMicroservices/Services/UserService/Containerfile \
            ECommerceMicroservices

      - name: Build Order Service image
        run: |
          podman build \
            -t localhost/ecommerce-order-service:ci \
            -f ECommerceMicroservices/Services/OrderService/Containerfile \
            ECommerceMicroservices

      - name: Build Payment Service image
        run: |
          podman build \
            -t localhost/ecommerce-payment-service:ci \
            -f ECommerceMicroservices/Services/PaymentService/Containerfile \
            ECommerceMicroservices

      - name: Build API Gateway image
        run: |
          podman build \
            -t localhost/ecommerce-api-gateway:ci \
            -f ECommerceMicroservices/ApiGateway/Containerfile \
            ECommerceMicroservices

      - name: Push Product Service image
        run: |
          podman tag localhost/ecommerce-product-service:ci \
            ghcr.io/${{ github.repository_owner }}/ecommerce-product-service:latest

          podman push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-product-service:latest

      - name: Push User Service image
        run: |
          podman tag localhost/ecommerce-user-service:ci \
            ghcr.io/${{ github.repository_owner }}/ecommerce-user-service:latest

          podman push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-user-service:latest

      - name: Push Order Service image
        run: |
          podman tag localhost/ecommerce-order-service:ci \
            ghcr.io/${{ github.repository_owner }}/ecommerce-order-service:latest

          podman push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-order-service:latest

      - name: Push Payment Service image
        run: |
          podman tag localhost/ecommerce-payment-service:ci \
            ghcr.io/${{ github.repository_owner }}/ecommerce-payment-service:latest

          podman push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-payment-service:latest

      - name: Push API Gateway image
        run: |
          podman tag localhost/ecommerce-api-gateway:ci \
            ghcr.io/${{ github.repository_owner }}/ecommerce-api-gateway:latest

          podman push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-api-gateway:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify kubectl
        shell: powershell
        run: |
          kubectl version --client

      - name: Verify Minikube
        shell: powershell
        run: |
          minikube status

      - name: Deploy Kubernetes manifests
        shell: powershell
        run: |
          kubectl apply -f ECommerceMicroservices/k8s/namespace.yaml
          kubectl apply -f ECommerceMicroservices/k8s/configmap.yaml
          kubectl apply -f ECommerceMicroservices/k8s/product-service.yaml
          kubectl apply -f ECommerceMicroservices/k8s/user-service.yaml
          kubectl apply -f ECommerceMicroservices/k8s/order-service.yaml
          kubectl apply -f ECommerceMicroservices/k8s/payment-service.yaml
          kubectl apply -f ECommerceMicroservices/k8s/api-gateway.yaml

      - name: Check rollout status
        shell: powershell
        run: |
          kubectl rollout status deployment/product-service -n ecommerce --timeout=120s
          kubectl rollout status deployment/user-service -n ecommerce --timeout=120s
          kubectl rollout status deployment/order-service -n ecommerce --timeout=120s
          kubectl rollout status deployment/payment-service -n ecommerce --timeout=120s
          kubectl rollout status deployment/api-gateway -n ecommerce --timeout=120s
